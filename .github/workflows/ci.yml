name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU-only PyTorch, then dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q backend main.py start.py deploy
      - name: Python test suite
        run: python -m pytest -q
        env:
          APP_ENV: development
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      - name: Provider suite (stdlib only)
        run: python -m unittest discover -s backend/providers/tests -t .
        env:
          APP_ENV: development
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
          GROQ_API_KEY: test_key
          TAVILY_API_KEY: test_key

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in frontend/js/*.js; do node --check "$f"; done
      - name: UI unit tests
        run: for f in backend/tests/js/*.test.js; do node "$f"; done
